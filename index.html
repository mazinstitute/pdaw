body[data-tod="dusk"]{--tint:52 30 84;--accent:#ffa45e;--accent2:#ffd1a1}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,#0b5fa8,#7fd0f0 55%,#bfeaff);color:var(--ink);font-size:14px}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

.glass{position:relative;isolation:isolate;background:linear-gradient(180deg,rgb(255 255 255/.16),rgb(var(--tint)/.46) 55%,rgb(var(--tint)/.6));border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgb(0 20 50/.38),inset 0 1px 0 rgb(255 255 255/.55),inset 0 -1px 0 rgb(255 255 255/.08);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);transition:background .8s}

svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.dim{color:var(--dim)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:999px;background:rgb(0 20 50/.35);border:1px solid var(--line);margin-bottom:14px}

.ct{display:flex;gap:4px;align-items:center}.ct input{width:100%;min-width:24px}
.row .mini{color:#12495a}.lane{width:100%;height:100%;display:block}
.phw{position:absolute;left:var(--iw);right:0;top:0;bottom:0;pointer-events:none}
#ph,#rph{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:linear-gradient(180deg,#fff,#e2fff2);box-shadow:0 0 12px #e2fff2,0 0 3px #fff;z-index:3;pointer-events:none}
.tlw .empty{color:#d6f1ff}.addrow{display:flex;gap:10px;flex-wrap:wrap}
.tb{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.ttl{font-weight:700;font-size:16px}.grp{display:flex;gap:5px;align-items:center;font-size:12px;color:#3d727c}
.rollwrap{overflow-x:auto;flex:none;border-radius:10px;border:1px solid rgb(20 85 105/.5);background:linear-gradient(180deg,rgb(30 108 122/.85),rgb(50 140 146/.7));box-shadow:inset 0 3px 12px rgb(5 40 55/.5),0 1px 0 #fffb}
.kbw{overflow-x:auto;flex:none;padding:8px;border-radius:10px;background:linear-gradient(180deg,rgb(30 108 122/.85),rgb(50 140 146/.7));box-shadow:inset 0 3px 10px rgb(5 40 55/.5),0 1px 0 #fffb}
.kb{position:relative;height:120px;min-width:540px;--tc:#4aa8d8;touch-action:none}
.k{position:absolute;top:0;bottom:0;border:1px solid #ffffffd0;border-radius:0 0 9px 9px;background:linear-gradient(180deg,#dcf0ee,#fff 40%,#f6fcf8 88%,#c2e3e0);box-shadow:inset 0 -7px 9px rgb(70 160 160/.35),0 4px 8px rgb(10 60 85/.35);color:#14566a;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;touch-action:none;user-select:none}
.k small{opacity:.6;font-size:10px}

.k.on{background:linear-gradient(180deg,var(--tc),#fff)}.k.b.on{background:linear-gradient(180deg,var(--tc),#134650)}
.kb.dr{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;min-width:0}
.pad{border-radius:18px;border:1px solid #ffffffd0;color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-shadow:0 1px 3px rgb(10 60 85/.7);background:radial-gradient(ellipse 70% 36% at 50% 14%,#ffffffd9,#fff0),linear-gradient(180deg,#ffffff40,#fff0 50%,rgb(0 0 0/.22) 52%,#0000),var(--tc);box-shadow:0 6px 12px rgb(10 60 85/.4),inset 0 -6px 10px rgb(0 0 0/.2);touch-action:none;user-select:none}
.pad.on{filter:brightness(1.35)}.pad small{opacity:.85}.hint{margin:0;color:#3d727c;font-size:12px}
.sf{display:flex;gap:12px;flex-wrap:wrap}.sf label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#3d727c;flex:1;min-width:130px}.sf input{width:100%}
.knobs{display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;font-size:12px;font-weight:600}.knob output{font-weight:500;color:#3d727c;font-size:11px}
.kn{--a:0deg;--p:0deg;width:56px;height:56px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;background:conic-gradient(from 225deg,#3fb0cf 0 var(--p),rgb(0 40 80/.25) var(--p) 270deg,#0000 270deg)}
.kn:after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 34% 24%,#fff,#e6f5f0 30%,#9ccac8 72%,#6a9ea0);box-shadow:0 4px 8px rgb(10 60 85/.45),inset 0 -3px 5px rgb(10 60 85/.3),0 0 0 1px #fff}
.kn i{position:absolute;left:50%;top:7px;width:3px;height:13px;margin-left:-1.5px;border-radius:2px;background:#14566a;transform-origin:50% 21px;transform:rotate(var(--a));z-index:2}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cl{max-height:min(46vh,340px);overflow:auto;display:flex;flex-direction:column;gap:5px}.cr{display:flex;gap:5px}
.pl{width:30px;flex:none;border-radius:9px;border:1px solid rgb(25 100 125/.5);color:#fff;font-size:11px;background:linear-gradient(180deg,#ffffffa0,#ffffff18 49%,#0000 50%),linear-gradient(180deg,#d6f29a,#8cc83e 50%,#5a9a22 51%,#92cf45)}
.cn{flex:1;text-align:left;border-radius:9px;border:1px solid rgb(25 100 125/.45);padding:5px 10px;font-weight:600;color:#12495a;background:linear-gradient(180deg,#fffffff0,#ffffff60 49%,#0000 50%),linear-gradient(180deg,#e0f1ee,#a8d6d2)}.cn small{font-weight:400;opacity:.75}.cn:hover,.pl:hover{filter:brightness(1.08)}

.glass{backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border-color:rgb(255 255 255/.4);box-shadow:0 18px 50px rgb(0 20 50/.42),inset 0 1px 0 rgb(255 255 255/.7),inset 0 -22px 40px rgb(120 200 255/.08)}
.glass:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(115deg,rgb(255 255 255/.16),#fff0 34%,#fff0 70%,rgb(255 255 255/.07))}
#desk{position:fixed;inset:0;z-index:4;display:grid;grid-template-columns:236px minmax(0,1fr) 272px;gap:12px;padding:12px}
#main{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.win{display:flex;flex-direction:column;padding:0 10px 10px;min-height:0;min-width:0;overflow:hidden;flex:1 1 0;border-radius:24px}
#w-ed{flex:1.6 1 0}#w-ins,#w-snd{height:100%;flex:none}
.wt{display:flex;align-items:center;gap:10px;height:48px;padding-left:8px;flex:none}.wc{display:none}
.wt b{font:italic 700 19px Fraunces,Georgia,serif;text-shadow:0 2px 10px rgb(0 20 60/.6)}
.wi{width:24px;height:24px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 26%,#fff 0 8%,#8cf0ff 26%,#1aa7e6 62%,#075a9e);box-shadow:0 3px 8px rgb(0 30 80/.5),inset 0 -4px 7px rgb(0 40 110/.5),inset 0 1px 2px #fff}
.wb{flex:1;min-height:0;overflow:auto;border-radius:16px;border:1px solid rgb(255 255 255/.22);background:rgb(0 22 58/.3);box-shadow:inset 0 2px 10px rgb(0 0 0/.25);padding:10px;display:flex;flex-direction:column;gap:10px;scrollbar-color:#5ecbff #0000}
.empty{margin:auto;text-align:center;padding:24px;color:var(--dim);max-width:300px;line-height:1.5}

.btn.rec{background:linear-gradient(180deg,#ffc2b4,#ff6a4a 47%,#d4381c 53%,#f2674a)}
.btn.icon{width:54px;height:54px;padding:0}.btn.ghost.on,.chip.on{background:linear-gradient(180deg,#8fe6ff,#2ab7ee 50%,#0b8bd0 52%,#27aee6);border-color:#fff9;color:#fff;text-shadow:0 1px 2px rgb(0 40 90/.6)}
.chip{cursor:pointer;color:inherit}.chip:hover{background:rgb(255 255 255/.22)}
.seg{margin:0}.seg.trk{display:flex;flex-wrap:wrap;gap:3px}.seg button{white-space:nowrap}
.mini{width:26px;height:24px;flex:none;padding:0;border-radius:8px;border:1px solid var(--line);background:rgb(255 255 255/.14);font-weight:700;font-size:12px}
.mini.on{background:linear-gradient(180deg,#d4ff8e,#8fdc2a 47%,#4fae10 53%,#86d62c);color:#143}
.tlw{background:linear-gradient(180deg,rgb(255 255 255/.12),rgb(4 40 96/.42));border:1px solid rgb(255 255 255/.28);box-shadow:inset 0 2px 12px rgb(0 0 0/.3);color:#fff}
.rollwrap,.kbw{background:linear-gradient(180deg,rgb(255 255 255/.1),rgb(4 40 96/.45));border:1px solid rgb(255 255 255/.28);box-shadow:inset 0 2px 12px rgb(0 0 0/.3)}
.hint,.grp,.tp,.sf label,.knob output,.card span{color:var(--dim)}.ttl{color:#fff}#stat{color:var(--accent2)}
select,.sf input{background:rgb(0 18 48/.45);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink);box-shadow:inset 0 2px 6px rgb(0 0 0/.3)}option{color:#000}
input[type=range]{accent-color:#3bd6ff}
.pg{grid-template-columns:1fr;gap:8px}
.card{display:grid;grid-template-columns:30px 1fr;column-gap:10px;align-items:center;padding:8px 12px;border-radius:16px;text-align:left;color:var(--ink);border:1px solid var(--line);background:linear-gradient(180deg,rgb(255 255 255/.2),rgb(255 255 255/.05));box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 4px 12px rgb(0 20 50/.3)}
.card:hover{background:rgb(255 255 255/.24);filter:none}.card i{grid-row:span 2;width:26px;height:26px;margin:0}

/* ===== BandLab-style layout ===== */
body{font-size:13px}
#desk{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1.25fr);gap:10px;padding:10px}
#main{display:contents}
#top{display:flex;align-items:center;gap:16px;padding:6px 16px;border-radius:999px}
.tbrand{display:flex;align-items:center;gap:8px;font:italic 700 16px Fraunces,Georgia,serif;white-space:nowrap}.tbrand .wi{width:20px;height:20px}
#w-tl{padding-top:10px;border-radius:20px}#w-tl .wt,#dock .wt{display:none}
#w-tl .wb{background:none;border:0;box-shadow:none;padding:0}
#dock{display:flex;flex-direction:column;min-height:0;border-radius:20px;padding:8px 10px 10px;gap:8px}
#dock .win{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;border-radius:0;flex:1 1 0}
#dock .win:before,#dock .win:after{display:none}
#dtabs{align-self:flex-start}
#w-ins{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,92vw);height:auto;max-height:80vh;flex:none;padding-top:4px}
.pg{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.btn.icon{width:38px;height:38px}.btn.icon svg{width:15px;height:15px}.btn.sm{padding:5px 12px;font-size:12px}
.chip{padding:3px 9px;font-size:11.5px}.seg button{padding:5px 12px;font-size:12px}
.mini{width:22px;height:20px;font-size:11px}
:root{--iw:176px}.row{height:54px}.info{padding:5px 8px 0 12px;gap:4px}.ruler{height:24px}
.rollwrap{flex:1;min-height:70px;overflow:auto}.kb{height:84px}.kbw{padding:6px}
.kn{width:44px;height:44px}.kn:after{inset:5px}.kn i{top:5px;height:10px;transform-origin:50% 17px}.knob{width:56px}
.wt b{font-size:16px}.wi{width:20px;height:20px}
.tp input{width:90px}.tbar{gap:6px 14px}

/* ===== Frutiger Aero: glass panels from the future ===== */
:root{--tint:6 56 140;--accent:#35c8ff;--accent2:#d6f3ff;--dim:rgb(236 246 255/.94);--line:rgb(255 255 255/.55)}
html,body{background:linear-gradient(180deg,#0648b8,#2f8ee8 55%,#dff0ff)}
body.no3d{background:radial-gradient(ellipse at 78% 6%,#fff9,#fff0 36%),linear-gradient(180deg,#05409e 0%,#1f7fe0 48%,#e4f2ff 62%,#3fc060 63%,#16863e 100%)}
#vig{mix-blend-mode:normal;background:radial-gradient(ellipse 50% 34% at 80% 0,rgb(255 255 255/.28),#fff0 70%),radial-gradient(ellipse at 50% 45%,#0000 62%,rgb(0 20 80/.28) 100%)}
body:before{content:"";position:fixed;inset:-20%;z-index:1;pointer-events:none;mix-blend-mode:screen;background:conic-gradient(from 190deg at 82% -6%,#fff0 0 8deg,rgb(255 255 255/.1) 13deg,#fff0 21deg,rgb(220 240 255/.08) 29deg,#fff0 38deg,rgb(255 255 255/.07) 46deg,#fff0 56deg)}

.glass:before{height:100%;background:linear-gradient(174deg,rgb(255 255 255/.24) 0 36%,#fff0 36.4%)}
.glass:after{background:linear-gradient(112deg,#fff0 0 58%,rgb(255 255 255/.09) 58% 66%,#fff0 66.4%)}
#top{background:linear-gradient(180deg,rgb(140 200 255/.2),rgb(6 56 140/.5))}
.wb{background:rgb(2 28 90/.28);border:1px solid rgb(255 255 255/.32);box-shadow:inset 0 2px 10px rgb(0 15 60/.35),inset 0 1px 0 rgb(255 255 255/.35)}

function metal(t,dec,vol,out){const hp=F(out,'highpass',7000),g=G(hp);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);[2,3,4.16,5.43,6.79,8.21].forEach(r=>OS(g,t,40*r,'square').stop(t+dec+.05))}

ep:{n:'Electric Piano',d:'Smooth, bell-like tines',c:'#ff8fb8',b:48,k:{tone:.8,atk:.5,rel:.5,rev:.3,dly:.1,pan:.5},f(p,t,v,o,am,rm){const f=hz(p),vg=G(o),c=G(vg);DEC(c,t,.5,2.4*rm);const car=OS(c,t,f),mod=AC.createOscillator(),mg=AC.createGain();mod.frequency.value=f;mg.gain.setValueAtTime(f*(1+v*2.2),t);mg.gain.setTargetAtTime(f*.35,t,.4);mod.connect(mg);mg.connect(car.frequency);mod.start(t);const tn=G(vg);DEC(tn,t,.12*v,.18);const os=[car,mod,OS(tn,t,f*7.07)];return tt=>RL(vg,os,t,tt,.25*rm)}},

bass:{n:'Synth Bass',d:'Deep, warm and punchy',c:'#6fe04a',b:36,k:{tone:.7,atk:.5,rel:.5,rev:.08,dly:0,pan:.5},f(p,t,v,o,am,rm){const f=hz(p),vg=G(o,.8),sh=AC.createWaveShaper();sh.curve=SAT;sh.connect(vg);const lp=F(sh,'lowpass',f*4,2.5);lp.frequency.setValueAtTime(f*14,t);lp.frequency.setTargetAtTime(f*3,t,.09);const g=G(lp);ADS(g,t,.006*am,.4,.8,.5*(.6+.4*v));const os=[OS(g,t,f,'sawtooth',-5),OS(g,t,f,'sawtooth',5),OS(g,t,f/2)];return tt=>RL(vg,os,t,tt,.1*rm)}},

function audio(){if(AC){if(AC.state!='running')AC.resume();return}
